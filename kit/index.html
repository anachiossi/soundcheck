<!doctype html>
<!-- kit/index.html — the kit website's door: asks for the password, opens the locked kit (kit.bin, made by
     soundcheck-data/tools/kit_site.py from the gear book) and shows it. Read only: nothing can be changed from here.
     Lock: AES-256-GCM, key = PBKDF2-SHA256 of the password, 600 000 rounds (same number as kit_site.py).
     kit.bin = salt (16 bytes) · iv (12 bytes) · the locked page. "Remember on this phone" keeps the key on the phone
     (never the password); a new kit.bin (new salt) simply asks for the password again.
     Used by: the 3 people Ana gives the link + password to (Ana, 26 Oct). Not part of the soundcheck app (no sw.js). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sound kit</title>
<style>
  :root { --ink: #0f172a; --soft: #64748b; --line: #cbd5e1; --paper: #fff; --go: #0f172a; --bad: #b91c1c; --gap: 12px; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--paper); }
  form { width: 100%; max-width: 360px; display: grid; gap: var(--gap); }
  h1 { margin: 0; font-size: 26px; }
  p { margin: 0; color: var(--soft); }
  input[type=password] { font: inherit; font-size: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
  label { display: flex; gap: 8px; align-items: center; color: var(--soft); }
  button { font: inherit; font-size: 18px; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
           background: var(--go); color: var(--paper); }
  .bad { color: var(--bad); }
</style>
</head>
<body>
<form id="door">
  <h1>Sound kit</h1>
  <p>What is in the kit and where it lives. Type the password you were given.</p>
  <input type="password" id="password" autocomplete="current-password" placeholder="Password" required>
  <label><input type="checkbox" id="remember" checked> Remember on this phone</label>
  <button id="open">Open</button>
  <p id="message" aria-live="polite"></p>
</form>
<script>
const ROUNDS = 600000;
const KEPT = 'kit-key';
const message = document.getElementById('message');
const say = (text, bad) => { message.textContent = text; message.className = bad ? 'bad' : ''; };

async function lockedKit() {
  const answer = await fetch('kit.bin', { cache: 'no-cache' });
  if (!answer.ok) throw new Error('missing');
  return new Uint8Array(await answer.arrayBuffer());
}

async function keyFrom(password, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ROUNDS }, base,
    { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}

// the page inside the locked kit, or null when the key doesn't open it
async function unlock(bytes, key) {
  try {
    const page = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(16, 28) }, key, bytes.slice(28));
    return new TextDecoder().decode(page);
  } catch { return null; }
}

function show(page) {
  document.open();
  document.write(page);   // the kit page and its little script (search, ticks, big photos)
  document.close();
}

async function keptKey() {
  try {
    const kept = JSON.parse(localStorage.getItem(KEPT) || 'null');
    return kept && crypto.subtle.importKey('jwk', kept, 'AES-GCM', true, ['decrypt']);
  } catch { return null; }
}

// a phone that was told to remember opens straight away
(async () => {
  const key = await keptKey();
  if (!key) return;
  say('Opening…');
  try {
    const page = await unlock(await lockedKit(), key);
    if (page) return show(page);
  } catch { /* no signal: the form stays */ }
  say('');
})();

document.getElementById('door').addEventListener('submit', async event => {
  event.preventDefault();
  say('Opening…');
  try {
    const bytes = await lockedKit();
    const key = await keyFrom(document.getElementById('password').value, bytes.slice(0, 16));
    const page = await unlock(bytes, key);
    if (!page) return say('Wrong password.', true);
    try {
      if (document.getElementById('remember').checked) localStorage.setItem(KEPT, JSON.stringify(await crypto.subtle.exportKey('jwk', key)));
      else localStorage.removeItem(KEPT);
    } catch { /* private window: not remembered */ }
    show(page);
  } catch {
    say('No signal, or the kit is not published yet. Try again in a moment.', true);
  }
});
</script>
</body>
</html>
